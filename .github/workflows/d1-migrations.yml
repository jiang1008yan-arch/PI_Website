name: Apply D1 migrations

# Why this exists:
# Cloudflare Pages auto-deploys CODE on every push to main, but it does NOT
# apply D1 database migrations. That gap let the schema drift behind the code
# (e.g. a new column referenced by the Workers functions never got added to the
# live D1), which surfaced as 500s and "the buttons do nothing". This workflow
# closes the gap: whenever a migration file lands on main, CI applies any
# pending migrations to the remote D1 so the schema always keeps up with the code.

on:
  push:
    branches: [main]
    paths:
      - "migrations/**"
      - ".github/workflows/d1-migrations.yml"
  # Lets you re-run it by hand from the Actions tab if a deploy ever races ahead.
  workflow_dispatch: {}

# Never run two migration jobs against the same DB at once.
concurrency:
  group: d1-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show pending migrations
        run: npx wrangler d1 migrations list sales-portal-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account ID is not secret (it appears in dashboard URLs). Override via
          # repo variable CLOUDFLARE_ACCOUNT_ID if this ever changes.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '2148e25e9cbd7149cfd7eb945e63752b' }}

      - name: Apply pending migrations to remote D1
        run: npx wrangler d1 migrations apply sales-portal-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '2148e25e9cbd7149cfd7eb945e63752b' }}
