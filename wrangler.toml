name = "sales-portal"
main = "src/worker.ts"
compatibility_date = "2025-04-01"

# SPA build output, served by the Worker. run_worker_first sends every request
# through src/worker.ts so /api/* (including navigations to /api/files/...
# download links) always reaches Hono; other paths go to env.ASSETS, which
# falls back to index.html for client-side routes.
[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
R2_PUBLIC_BASE = ""

[[d1_databases]]
binding = "DB"
database_name = "sales-portal-db"
database_id = "fd065e2a-698f-4a51-ba91-428ba5f22734"

[[r2_buckets]]
binding = "FILES"
bucket_name = "sales-portal-files"

# Background jobs (Feishu bot NOTIFY / ANALYZE / ANSWER). Create once with:
#   wrangler queues create app-jobs
#   wrangler queues create app-jobs-dlq
[[queues.producers]]
binding = "JOBS"
queue = "app-jobs"

[[queues.consumers]]
queue = "app-jobs"
max_batch_size = 10
max_batch_timeout = 2
max_retries = 3
dead_letter_queue = "app-jobs-dlq"

[ai]
binding = "AI"

# Hourly janitor (functions/scheduled.ts).
[triggers]
crons = ["0 * * * *"]

# Keep the port the Vite dev server proxies /api to (web/vite.config.ts).
[dev]
port = 8788
